<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KioskoControl: control de inventario, incidentes y alertas para tu kiosko." />
    <meta name="theme-color" content="#FAF5EA" />
    <script>
      // Aplica el tema antes del primer pintado para evitar parpadeos.
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('kiosko-theme') || 'null');
          var theme = stored && stored.state && stored.state.theme;
          if (theme !== 'dark' && theme !== 'light') {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var root = document.documentElement;
          if (theme === 'dark') root.classList.add('dark');
          root.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0E0B1A' : '#FAF5EA');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>KioskoControl</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
